<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title desc"><title id="title">고객 행동과 측정 단계</title><desc id="desc">카테고리 탐색 → 상품·조건 비교 → 주문 완료 → 취소·재구매. 실제 성과가 아닌 측정 구조 예시.</desc><g font-family="Arial,Malgun Gothic,sans-serif"><rect x="12" y="18" width="456" height="80" rx="12" fill="#2c332e" stroke="#58625b"/><text x="34" y="51" fill="#aab6ae" font-size="12">01</text><text x="78" y="52" fill="#fff" font-size="22" font-weight="700">카테고리 탐색</text><text x="78" y="78" fill="#bdc5bf" font-size="13">검색 노출·클릭</text><path d="M240 102v13m-4-4 4 4 4-4" fill="none" stroke="#a8c785" stroke-width="2"/><rect x="12" y="119" width="456" height="80" rx="12" fill="#2c332e" stroke="#58625b"/><text x="34" y="152" fill="#aab6ae" font-size="12">02</text><text x="78" y="153" fill="#fff" font-size="22" font-weight="700">상품·조건 비교</text><text x="78" y="179" fill="#bdc5bf" font-size="13">페이지·콘텐츠 탐색</text><path d="M240 203v13m-4-4 4 4 4-4" fill="none" stroke="#a8c785" stroke-width="2"/><rect x="12" y="220" width="456" height="80" rx="12" fill="#2c332e" stroke="#58625b"/><text x="34" y="253" fill="#aab6ae" font-size="12">03</text><text x="78" y="254" fill="#fff" font-size="22" font-weight="700">주문 완료</text><text x="78" y="280" fill="#bdc5bf" font-size="13">접수 성공 기록</text><path d="M240 304v13m-4-4 4 4 4-4" fill="none" stroke="#a8c785" stroke-width="2"/><rect x="12" y="321" width="456" height="80" rx="12" fill="#d2ecac" stroke="#d2ecac"/><text x="34" y="354" fill="#485a37" font-size="12">04</text><text x="78" y="355" fill="#202522" font-size="22" font-weight="700">취소·재구매</text><text x="78" y="381" fill="#485a37" font-size="13">업무 시스템에서 확인</text></g></svg>