name: Deploy Next.js to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  NEXT_PUBLIC_SITE_URL: https://osmu-studio.com
  SITE_PUBLIC: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Validate contact input and notification retries
        run: node --test tests/contact-validation.test.mjs tests/contact-delivery.test.mjs tests/cms-preservation.test.mjs tests/cms-status.test.mjs tests/admin-navigation.test.mjs tests/crm.test.mjs tests/operations.test.mjs tests/tracking.test.mjs tests/analytics-report.test.mjs tests/measurement-dashboard.test.mjs tests/meta-ads.test.mjs tests/marketing-metrics.test.mjs tests/inquiry-count.test.mjs tests/inquiry-crm.test.mjs
      - name: Fetch published CMS snapshot
        run: npm run cms:sync
      - run: npm run build
      - run: npm run typecheck
      - name: Validate public pages, metadata, links, and media
        run: npm run validate:export
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs

